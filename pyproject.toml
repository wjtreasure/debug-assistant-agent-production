[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debug-assistant-agent"
dynamic = ["version"]
description = "Evidence-constrained CloudOps incident diagnosis agent with A0/A1/A2 control policies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1.0,<2", "numpy>=1.26,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
semantic = ["faiss-cpu>=1.8"]
orchestration = ["langgraph>=0.2,<2"]

[project.scripts]
debug-assistant = "debug_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["debug_assistant*"]
exclude = ["debug_assistant.evaluation*"]

[tool.setuptools.package-data]
"debug_assistant.skills" = ["*/SKILL.md"]
"debug_assistant._vendor" = ["LICENSE.cloudops"]

[tool.setuptools.dynamic]
version = {attr = "debug_assistant.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "external_dataset: requires the locally provisioned full CloudOps dataset",
]
