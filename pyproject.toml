[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debug-assistant-agent"
version = "1.3.0"
description = "Read-only repository diagnosis agent with a production-style agent harness and SWE-bench localization evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
eval = ["pandas>=2.1", "pyarrow>=15", "datasets>=3"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
debug-assistant = "debug_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
